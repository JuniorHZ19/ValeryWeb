<aside class="sidebar" [class.sidebar--open]="menuOpen()">
  <div class="sidebar__top">
    <a routerLink="/admin" class="sidebar__brand"><app-brand [inverse]="true" /></a>
    <button
      type="button"
      class="sidebar__toggle"
      aria-controls="admin-nav"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="menuOpen.set(!menuOpen())"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>

  <nav id="admin-nav" class="sidebar__nav" aria-label="Administración">
    <p class="sidebar__label">Panel de administración</p>
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a class="sidebar__link" [routerLink]="link.path" routerLinkActive="sidebar__link--active" (click)="menuOpen.set(false)">
            <app-icon [name]="link.icon" [size]="20" /> {{ link.label }}
          </a>
        </li>
      }
      <li>
        <a class="sidebar__link" routerLink="/" target="_blank" rel="noopener">
          <app-icon name="arrowRight" [size]="20" /> Ver sitio público
        </a>
      </li>
    </ul>

    <div class="sidebar__user">
      <span>Sesión: <strong>{{ username() }}</strong></span>
      <button type="button" class="sidebar__logout" (click)="logout()">Cerrar sesión</button>
    </div>
  </nav>
</aside>

<main class="content">
  <router-outlet />
</main>
