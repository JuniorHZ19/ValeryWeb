@let p = product();
<a class="card" [routerLink]="['/productos', p.slug]">
  <figure class="card__figure">
    <img class="card__img" [src]="p.imageUrl | media" [alt]="p.imageAlt" loading="lazy" />
  </figure>
  <div class="card__body">
    <h3 class="card__title">{{ p.name }}</h3>
    <ul class="card__details">
      @for (detail of p.details.slice(0, 3); track detail) {
        <li><app-icon name="check" [size]="16" /> {{ detail }}</li>
      }
    </ul>
    <p class="card__footer">
      <span class="card__price">
        @if (p.price !== null) {
          {{ p.price | currency: 'PEN' : 'S/ ' : '1.2-2' }}
        } @else {
          Precio a consultar
        }
      </span>
      <span class="card__more">Ver detalles <app-icon name="arrowRight" [size]="16" /></span>
    </p>
  </div>
</a>
